name: nova_dbt
version: "1.0.0"
config-version: 2
profile: nova

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
analysis-paths: ["analyses"]
clean-targets: ["target", "dbt_packages"]

vars:
  data_start_date: "2024-01-01"
  data_end_date: "2025-12-31"
  bulk_order_qty_threshold: 20          # any line with qty >= 20 => B2B bulk order (excluded from AOV)
  internal_email_domain: "novacommerce.test"
  churn_inactivity_days: 90
  far_future: "9999-12-31"

models:
  nova_dbt:
    +persist_docs: {relation: true, columns: true}
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: table
    marts:
      +schema: marts
      +materialized: table
    metrics:
      +schema: metrics
      +materialized: table

seeds:
  nova_dbt:
    +schema: seeds

data_tests:
  nova_dbt:
    +store_failures: true
    +schema: dq_failures
