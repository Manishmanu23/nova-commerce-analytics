nova:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('PGHOST', 'localhost') }}"
      port: "{{ env_var('PGPORT', '5432') | int }}"
      user: "{{ env_var('PGUSER', 'nova') }}"
      password: "{{ env_var('PGPASSWORD', 'nova') }}"
      dbname: "{{ env_var('PGDATABASE', 'nova') }}"
      schema: public
      threads: 4
    ci:
      type: postgres
      host: "{{ env_var('PGHOST', 'localhost') }}"
      port: "{{ env_var('PGPORT', '5432') | int }}"
      user: "{{ env_var('PGUSER', 'nova') }}"
      password: "{{ env_var('PGPASSWORD', 'nova') }}"
      dbname: "{{ env_var('PGDATABASE', 'nova') }}"
      schema: public
      threads: 2
