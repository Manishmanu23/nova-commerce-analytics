[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nova-commerce-analytics"
version = "1.0.0"
description = "Decision Intelligence & Revenue Analytics Platform for a fictional Indian D2C business"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.1", "numpy>=1.26", "scipy>=1.11", "statsmodels>=0.14",
  "psycopg[binary]>=3.1", "sqlalchemy>=2.0", "pyyaml>=6.0",
  "dbt-core>=1.10,<1.11", "dbt-postgres>=1.9,<1.10",
]
[project.optional-dependencies]
copilot = ["anthropic>=0.40", "streamlit>=1.35", "requests>=2.31"]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["python"]
include = ["nova*"]

[tool.ruff]
line-length = 120
src = ["python"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501", "E731", "E702", "B905", "B023"]

[tool.pytest.ini_options]
pythonpath = ["python"]
testpaths = ["tests"]
